plugins { id 'com.android.application' }

def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.dvlce.claudeisland'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.dvlce.claudeisland'
        minSdk 26
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir "$buildDir/generated/gameAssets"
}

tasks.register('syncGameAssets', Sync) {
    from '../../dist'
    into "$buildDir/generated/gameAssets/game"
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
